name: CI

on:
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - "*.md"
      - "docs/*"
      - "docs/agents/**"
      - "docs/plans/**"
      - "docs/validation/**"
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - "*.md"
      - "docs/*"
      - "docs/agents/**"
      - "docs/plans/**"
      - "docs/validation/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  EXPO_NO_DOTENV: 1
  EXPO_PUBLIC_API_URL: https://api.ci.invalid/v1

jobs:
  # Skips an app's jobs on a pull request whose changes all sit inside the other
  # app. Anything shared (root files, workflows, scripts, docs/api) runs both, and
  # the frontend also runs for backend migrations, which its tests read. Pushes to
  # main and develop run everything.
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Check out repository
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The pull request merge commit and its first parent, the base branch.
          fetch-depth: 2

      - name: Classify changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            echo "backend=true" >> "${GITHUB_OUTPUT}"
            echo "frontend=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # Mirrors the paths-ignore of the triggers above.
          changed="$(git diff --name-only HEAD^1 HEAD \
            | grep -vE '^[^/]+\.md$|^docs/[^/]+$|^docs/(agents|plans|validation)/' || true)"
          printf 'Changed files:\n%s\n' "${changed}"
          backend=false
          frontend=false
          if grep -qv '^apps/frontend/' <<<"${changed}"; then backend=true; fi
          if grep -qv '^apps/backend/' <<<"${changed}" \
            || grep -q '^apps/backend/src/migrations/' <<<"${changed}"; then frontend=true; fi
          echo "backend=${backend}" | tee -a "${GITHUB_OUTPUT}"
          echo "frontend=${frontend}" | tee -a "${GITHUB_OUTPUT}"

  backend:
    name: Backend (build, lint, unit, integration)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 3306
      TEST_DB_ADMIN_USERNAME: root
      TEST_DB_ADMIN_PASSWORD: root
    steps:
      # A step instead of a service container: services cannot pass server options.
      # The test databases are thrown away, so keep them in memory and skip the
      # durability work (binlog, per-commit flush, doublewrite). The integration
      # run migrates one template database and clones it for every test.
      # Started before npm ci so MySQL initialises while dependencies install.
      - name: Start MySQL
        run: |
          docker run --detach --name mysql \
            --tmpfs /var/lib/mysql:rw \
            --env MYSQL_ROOT_PASSWORD=root \
            --publish 3306:3306 \
            mysql:8.0 \
            --skip-log-bin \
            --innodb-flush-log-at-trx-commit=0 \
            --innodb-doublewrite=0

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Record resolved tool versions
        run: |
          node --version
          npm --version
          npm ls --depth=0 --workspaces --include-workspace-root

      # The entrypoint's temporary init server does not listen on TCP, so a TCP login
      # with the root password only succeeds once the real server is up.
      - name: Wait for MySQL
        run: |
          for _ in {1..60}; do
            if docker exec mysql mysql --protocol=TCP -h127.0.0.1 -uroot -proot -e 'SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs mysql
          exit 1

      - name: Verify backend quality gate
        run: npm run ci:backend

  frontend:
    name: Frontend (typecheck, lint, Expo, delivery)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Record resolved tool versions
        run: |
          node --version
          npm --version
          docker --version

      # verify:m2 without the unit tests, which run sharded in frontend-unit.
      - name: Typecheck
        run: npm run typecheck --workspace apps/frontend

      - name: Lint
        run: npm run lint --workspace apps/frontend

      - name: Export the web build
        run: npm run build --workspace apps/frontend

      # The GitHub Actions layer cache needs a BuildKit container builder and the
      # runtime token, which plain run steps do not get.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Expose the GitHub Actions runtime to Buildx
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Verify the web delivery container
        env:
          # --load: a container builder keeps images to itself unless told to load them.
          DELIVERY_BUILD_FLAGS: >-
            --load
            --cache-from type=gha,scope=frontend-delivery
            --cache-to type=gha,mode=max,scope=frontend-delivery,ignore-error=true
        run: npm run test:delivery --workspace apps/frontend

  # The unit tests stay --runInBand: on one machine, parallel workers time out the
  # heavy screen tests. Each shard is a machine of its own instead.
  frontend-unit:
    name: Frontend unit (${{ matrix.shard }}/3)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run unit tests
        run: npm test --workspace apps/frontend -- --shard=${{ matrix.shard }}/3

  openapi:
    name: OpenAPI contract lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Lint OpenAPI contract
        run: npm run lint:openapi

  # Runs alongside the other jobs: it builds its own images and uses nothing they
  # produce. CI OK still requires every job, so a failure anywhere blocks the merge.
  e2e:
    name: Web E2E (Docker Compose + Playwright)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Record resolved tool versions
        run: |
          node --version
          npm --version
          docker compose version

      # The GitHub Actions layer cache needs a BuildKit container builder and the
      # runtime token, which plain run steps do not get.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Expose the GitHub Actions runtime to Buildx
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Install Chromium
        working-directory: apps/frontend
        run: npm run playwright:install

      - name: Run Web E2E gate
        env:
          COMPOSE_PROJECT_NAME: wise-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          E2E_BASE_URL: https://127.0.0.1:8443
          E2E_API_URL: https://127.0.0.1:8443/api/v1
          E2E_BACKEND_PORT: 3000
          E2E_FRONTEND_PORT: 8443
          E2E_DB_PORT: 3307
          E2E_COMPOSE_OVERRIDE: docker-compose.e2e.ci.yml
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/frontend/playwright-report
            apps/frontend/test-results
          if-no-files-found: ignore
          retention-days: 3

  # Single required status check for branch protection. Jobs above can be
  # added, renamed or split without touching the repository rules.
  ci-ok:
    name: CI OK
    if: ${{ always() }}
    needs: [changes, backend, frontend, frontend-unit, openapi, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # "skipped" is a job the changes job left out. If changes itself fails, its
      # own "failure" is in the list, so a skip can never hide a broken filter.
      - name: Fail unless every required job succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [[ "${result}" != "success" && "${result}" != "skipped" ]]; then
              echo "::error::At least one required job did not succeed."
              exit 1
            fi
          done
