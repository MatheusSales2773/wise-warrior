name: CI

on:
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - "*.md"
      - "docs/*"
      - "docs/agents/**"
      - "docs/plans/**"
      - "docs/validation/**"
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - "*.md"
      - "docs/*"
      - "docs/agents/**"
      - "docs/plans/**"
      - "docs/validation/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  EXPO_NO_DOTENV: 1
  EXPO_PUBLIC_API_URL: https://api.ci.invalid/v1

jobs:
  backend:
    name: Backend (build, lint, unit, integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 3306
      TEST_DB_ADMIN_USERNAME: root
      TEST_DB_ADMIN_PASSWORD: root
    steps:
      # A step instead of a service container: services cannot pass server options.
      # The test databases are thrown away, so keep them in memory and skip the
      # durability work (binlog, per-commit flush, doublewrite). Each integration
      # suite runs every migration, and that DDL is what the job waits on.
      # Started before npm ci so MySQL initialises while dependencies install.
      - name: Start MySQL
        run: |
          docker run --detach --name mysql \
            --tmpfs /var/lib/mysql:rw \
            --env MYSQL_ROOT_PASSWORD=root \
            --publish 3306:3306 \
            mysql:8.0 \
            --skip-log-bin \
            --innodb-flush-log-at-trx-commit=0 \
            --innodb-doublewrite=0

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Record resolved tool versions
        run: |
          node --version
          npm --version
          npm ls --depth=0 --workspaces --include-workspace-root

      # The entrypoint's temporary init server does not listen on TCP, so a TCP login
      # with the root password only succeeds once the real server is up.
      - name: Wait for MySQL
        run: |
          for _ in {1..60}; do
            if docker exec mysql mysql --protocol=TCP -h127.0.0.1 -uroot -proot -e 'SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs mysql
          exit 1

      - name: Verify backend quality gate
        run: npm run ci:backend

  frontend:
    name: Frontend (typecheck, lint, unit, Expo, delivery)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Record resolved tool versions
        run: |
          node --version
          npm --version
          docker --version

      - name: Verify frontend quality gate
        run: npm run ci:frontend

  openapi:
    name: OpenAPI contract lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint OpenAPI contract
        run: npm run lint:openapi

  # Runs alongside the other jobs: it builds its own images and uses nothing they
  # produce. CI OK still requires every job, so a failure anywhere blocks the merge.
  e2e:
    name: Web E2E (Docker Compose + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Record resolved tool versions
        run: |
          node --version
          npm --version
          docker compose version

      - name: Install Chromium
        working-directory: apps/frontend
        run: npm run playwright:install

      - name: Run Web E2E gate
        env:
          COMPOSE_PROJECT_NAME: wise-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          E2E_BASE_URL: https://127.0.0.1:8443
          E2E_API_URL: https://127.0.0.1:8443/api/v1
          E2E_BACKEND_PORT: 3000
          E2E_FRONTEND_PORT: 8443
          E2E_DB_PORT: 3307
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/frontend/playwright-report
            apps/frontend/test-results
          if-no-files-found: ignore
          retention-days: 3

  # Single required status check for branch protection. Jobs above can be
  # added, renamed or split without touching the repository rules.
  ci-ok:
    name: CI OK
    if: ${{ always() }}
    needs: [backend, frontend, openapi, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [[ "${result}" != "success" ]]; then
              echo "::error::At least one required job did not succeed."
              exit 1
            fi
          done
