server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  location ~* "[.-][0-9a-f]{16,}(?:@[0-9]+x)?\.(?:css|gif|ico|jpe?g|js|png|svg|webp|woff2?)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
