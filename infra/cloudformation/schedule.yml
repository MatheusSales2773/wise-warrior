AWSTemplateFormatVersion: "2010-09-09"
Description: Rotina que liga e desliga o ambiente (RDS, NAT e app) para economizar credito

Parameters:
  ComputeStackName:
    Type: String
    Default: wise-warrior-compute
  DataStackName:
    Type: String
    Default: wise-warrior-data
  ActiveDays:
    Type: String
    Default: MON-FRI
    Description: Dias da semana ativos, no formato do cron (ex. MON-FRI ou "*")

Resources:
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: start-stop-environment
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:StartInstances
                  - ec2:StopInstances
                Resource:
                  - !Sub
                    - "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}"
                    - InstanceId:
                        Fn::ImportValue: !Sub "${ComputeStackName}-AppInstanceId"
                  - !Sub
                    - "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}"
                    - InstanceId:
                        Fn::ImportValue: !Sub "${ComputeStackName}-NatInstanceId"
              - Effect: Allow
                Action:
                  - rds:StartDBInstance
                  - rds:StopDBInstance
                Resource: !Sub
                  - "arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:${DbInstanceId}"
                  - DbInstanceId:
                      Fn::ImportValue: !Sub "${DataStackName}-DbInstanceId"

  StartDatabase:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Liga o RDS primeiro, porque ele demora a ficar disponivel
      ScheduleExpression: !Sub "cron(45 9 ? * ${ActiveDays} *)"
      ScheduleExpressionTimezone: America/Sao_Paulo
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:rds:startDBInstance
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub
          - '{"DbInstanceIdentifier":"${DbInstanceId}"}'
          - DbInstanceId:
              Fn::ImportValue: !Sub "${DataStackName}-DbInstanceId"
        RetryPolicy:
          MaximumRetryAttempts: 5
          MaximumEventAgeInSeconds: 3600

  StartNat:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Liga a NAT antes do app, que precisa de internet para subir
      ScheduleExpression: !Sub "cron(50 9 ? * ${ActiveDays} *)"
      ScheduleExpressionTimezone: America/Sao_Paulo
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:ec2:startInstances
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub
          - '{"InstanceIds":["${InstanceId}"]}'
          - InstanceId:
              Fn::ImportValue: !Sub "${ComputeStackName}-NatInstanceId"
        RetryPolicy:
          MaximumRetryAttempts: 5
          MaximumEventAgeInSeconds: 3600

  StartApp:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Liga a EC2 do app
      ScheduleExpression: !Sub "cron(55 9 ? * ${ActiveDays} *)"
      ScheduleExpressionTimezone: America/Sao_Paulo
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:ec2:startInstances
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub
          - '{"InstanceIds":["${InstanceId}"]}'
          - InstanceId:
              Fn::ImportValue: !Sub "${ComputeStackName}-AppInstanceId"
        RetryPolicy:
          MaximumRetryAttempts: 5
          MaximumEventAgeInSeconds: 3600

  StopApp:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Desliga o app primeiro
      ScheduleExpression: !Sub "cron(0 18 ? * ${ActiveDays} *)"
      ScheduleExpressionTimezone: America/Sao_Paulo
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:ec2:stopInstances
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub
          - '{"InstanceIds":["${InstanceId}"]}'
          - InstanceId:
              Fn::ImportValue: !Sub "${ComputeStackName}-AppInstanceId"
        RetryPolicy:
          MaximumRetryAttempts: 5
          MaximumEventAgeInSeconds: 3600

  StopNat:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Desliga a NAT depois do app
      ScheduleExpression: !Sub "cron(5 18 ? * ${ActiveDays} *)"
      ScheduleExpressionTimezone: America/Sao_Paulo
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:ec2:stopInstances
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub
          - '{"InstanceIds":["${InstanceId}"]}'
          - InstanceId:
              Fn::ImportValue: !Sub "${ComputeStackName}-NatInstanceId"
        RetryPolicy:
          MaximumRetryAttempts: 5
          MaximumEventAgeInSeconds: 3600

  StopDatabase:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Desliga o RDS por ultimo
      ScheduleExpression: !Sub "cron(10 18 ? * ${ActiveDays} *)"
      ScheduleExpressionTimezone: America/Sao_Paulo
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:rds:stopDBInstance
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub
          - '{"DbInstanceIdentifier":"${DbInstanceId}"}'
          - DbInstanceId:
              Fn::ImportValue: !Sub "${DataStackName}-DbInstanceId"
        RetryPolicy:
          MaximumRetryAttempts: 5
          MaximumEventAgeInSeconds: 3600

  StopAllLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-stop-all"
      RetentionInDays: 7

  StopAllRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: stop-environment
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ec2:StopInstances
                Resource:
                  - !Sub
                    - "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}"
                    - InstanceId:
                        Fn::ImportValue: !Sub "${ComputeStackName}-AppInstanceId"
                  - !Sub
                    - "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}"
                    - InstanceId:
                        Fn::ImportValue: !Sub "${ComputeStackName}-NatInstanceId"
              - Effect: Allow
                Action: rds:StopDBInstance
                Resource: !Sub
                  - "arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:${DbInstanceId}"
                  - DbInstanceId:
                      Fn::ImportValue: !Sub "${DataStackName}-DbInstanceId"
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt StopAllLogGroup.Arn

  StopAllFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-stop-all"
      Description: Desliga o app, a NAT e o RDS de uma vez
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt StopAllRole.Arn
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref StopAllLogGroup
      Environment:
        Variables:
          APP_INSTANCE_ID:
            Fn::ImportValue: !Sub "${ComputeStackName}-AppInstanceId"
          NAT_INSTANCE_ID:
            Fn::ImportValue: !Sub "${ComputeStackName}-NatInstanceId"
          DB_INSTANCE_ID:
            Fn::ImportValue: !Sub "${DataStackName}-DbInstanceId"
      Code:
        ZipFile: |
          import os

          import boto3

          ec2 = boto3.client("ec2")
          rds = boto3.client("rds")


          def handler(event, context):
              instance_ids = [os.environ["APP_INSTANCE_ID"], os.environ["NAT_INSTANCE_ID"]]
              ec2.stop_instances(InstanceIds=instance_ids)
              result = {"ec2": f"stopping {instance_ids}"}
              try:
                  rds.stop_db_instance(DBInstanceIdentifier=os.environ["DB_INSTANCE_ID"])
                  result["rds"] = "stopping"
              except rds.exceptions.InvalidDBInstanceStateFault as error:
                  result["rds"] = f"skipped: {error.response['Error']['Message']}"
              return result

  StartAllLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-start-all"
      RetentionInDays: 7

  StartAllRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-environment
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ec2:StartInstances
                Resource:
                  - !Sub
                    - "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}"
                    - InstanceId:
                        Fn::ImportValue: !Sub "${ComputeStackName}-AppInstanceId"
                  - !Sub
                    - "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}"
                    - InstanceId:
                        Fn::ImportValue: !Sub "${ComputeStackName}-NatInstanceId"
              - Effect: Allow
                Action: rds:StartDBInstance
                Resource: !Sub
                  - "arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:${DbInstanceId}"
                  - DbInstanceId:
                      Fn::ImportValue: !Sub "${DataStackName}-DbInstanceId"
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt StartAllLogGroup.Arn

  StartAllFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-start-all"
      Description: Liga o RDS, a NAT e o app de uma vez
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt StartAllRole.Arn
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref StartAllLogGroup
      Environment:
        Variables:
          APP_INSTANCE_ID:
            Fn::ImportValue: !Sub "${ComputeStackName}-AppInstanceId"
          NAT_INSTANCE_ID:
            Fn::ImportValue: !Sub "${ComputeStackName}-NatInstanceId"
          DB_INSTANCE_ID:
            Fn::ImportValue: !Sub "${DataStackName}-DbInstanceId"
      Code:
        ZipFile: |
          import os

          import boto3

          ec2 = boto3.client("ec2")
          rds = boto3.client("rds")


          def handler(event, context):
              result = {}
              try:
                  rds.start_db_instance(DBInstanceIdentifier=os.environ["DB_INSTANCE_ID"])
                  result["rds"] = "starting"
              except rds.exceptions.InvalidDBInstanceStateFault as error:
                  result["rds"] = f"skipped: {error.response['Error']['Message']}"
              instance_ids = [os.environ["NAT_INSTANCE_ID"], os.environ["APP_INSTANCE_ID"]]
              ec2.start_instances(InstanceIds=instance_ids)
              result["ec2"] = f"starting {instance_ids}"
              return result

Outputs:
  StopAllFunctionName:
    Description: "aws lambda invoke --function-name <valor> --region us-east-1 /dev/stdout"
    Value: !Ref StopAllFunction

  StartAllFunctionName:
    Description: "aws lambda invoke --function-name <valor> --region us-east-1 /dev/stdout"
    Value: !Ref StartAllFunction
