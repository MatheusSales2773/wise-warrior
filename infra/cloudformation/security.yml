AWSTemplateFormatVersion: "2010-09-09"
Description: Security Groups do ambiente (ALB, app, NAT instance, RDS)

Parameters:
  NetworkStackName:
    Type: String
    Default: wise-warrior-network

Resources:
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Entrada HTTP e HTTPS vinda da internet para o ALB
      VpcId: !ImportValue
        Fn::Sub: "${NetworkStackName}-VpcId"
      Tags:
        - Key: Name
          Value: wise-warrior-sg-alb

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Entrada do ALB para o backend e o frontend
      VpcId: !ImportValue
        Fn::Sub: "${NetworkStackName}-VpcId"
      Tags:
        - Key: Name
          Value: wise-warrior-sg-app

  NatSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Entrada da subnet de app para a NAT instance
      VpcId: !ImportValue
        Fn::Sub: "${NetworkStackName}-VpcId"
      Tags:
        - Key: Name
          Value: wise-warrior-sg-nat

  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Entrada do app para o MySQL
      VpcId: !ImportValue
        Fn::Sub: "${NetworkStackName}-VpcId"
      Tags:
        - Key: Name
          Value: wise-warrior-sg-rds

  AlbIngressHttp:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AlbSecurityGroup
      Description: HTTP da internet
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: 0.0.0.0/0

  AlbIngressHttps:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AlbSecurityGroup
      Description: HTTPS da internet
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0

  AppIngressBackend:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AppSecurityGroup
      Description: Backend (Nest) vindo do ALB
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      SourceSecurityGroupId: !Ref AlbSecurityGroup

  AppIngressFrontend:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AppSecurityGroup
      Description: Frontend (nginx) vindo do ALB
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourceSecurityGroupId: !Ref AlbSecurityGroup

  NatIngressFromApp:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref NatSecurityGroup
      Description: Todo o tráfego de saída do app para a internet
      IpProtocol: "-1"
      SourceSecurityGroupId: !Ref AppSecurityGroup

  RdsIngressMysql:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroup
      Description: MySQL vindo do app
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref AppSecurityGroup

Outputs:
  AlbSecurityGroupId:
    Value: !Ref AlbSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-AlbSecurityGroupId"

  AppSecurityGroupId:
    Value: !Ref AppSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-AppSecurityGroupId"

  NatSecurityGroupId:
    Value: !Ref NatSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-NatSecurityGroupId"

  RdsSecurityGroupId:
    Value: !Ref RdsSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-RdsSecurityGroupId"
