asyncapi: "3.0.0"
info:
  title: Wise Realtime
  version: "1.0.0"
  description: >
    Eventos Socket.IO 4.x do servidor para o app (ADR-009). O cliente conecta ao mesmo host da API REST
    com o access token em `auth.token` do handshake. Ao conectar, o servidor coloca o socket na room
    `user:{userId}` e, se o usuário tem Guild, na room `guild:{guildId}`. Criar, entrar ou sair de uma
    Guild atualiza as rooms de todos os sockets do usuário sem reconectar, então ninguém recebe eventos
    de uma Guild que não é sua. Revogar uma Sessão (logout, revogação de dispositivo, reuso de refresh token ou limite de dispositivos) encerra o socket daquele dispositivo; os demais seguem conectados. Os eventos abaixo só descem; o app não emite eventos.
servers:
  development:
    host: localhost:3000
    protocol: ws
    description: Desenvolvimento local
    security:
      - $ref: "#/components/securitySchemes/accessToken"
channels:
  guildRoom:
    address: "guild:{guildId}"
    description: Room Socket.IO de uma Guild. Só os sockets dos membros atuais entram nela.
    parameters:
      guildId:
        description: Identificador da Guild
    messages:
      raidProgress:
        $ref: "#/components/messages/raidProgress"
  userRoom:
    address: "user:{userId}"
    description: Room Socket.IO de um usuário. Todos os sockets dele, em qualquer dispositivo, entram nela.
    parameters:
      userId:
        description: Identificador do usuário
    messages:
      raidComplete:
        $ref: "#/components/messages/raidComplete"
      xpUpdated:
        $ref: "#/components/messages/xpUpdated"
      levelUp:
        $ref: "#/components/messages/levelUp"
      equipmentChanged:
        $ref: "#/components/messages/equipmentChanged"
      coinsChanged:
        $ref: "#/components/messages/coinsChanged"
operations:
  receiveRaidProgress:
    action: receive
    channel:
      $ref: "#/channels/guildRoom"
    summary: Progresso da Raid ativa mudou
    description: >
      Emitido para a room da Guild depois do commit de uma Contribuição. O app atualiza o cache da Raid
      ativa e invalida o Ranking interno.
    messages:
      - $ref: "#/channels/guildRoom/messages/raidProgress"
  receiveRaidComplete:
    action: receive
    channel:
      $ref: "#/channels/userRoom"
    summary: Uma Raid da qual o usuário participou foi encerrada
    description: >
      Emitido para a room de cada Participante depois do commit do fechamento semanal, uma única vez por
      Participante e Raid, mesmo se o fechamento rodar de novo. O app invalida a Raid ativa, as Raids
      anteriores, a Guild (Nível) e o Catálogo de cosméticos.
    messages:
      - $ref: "#/channels/userRoom/messages/raidComplete"
  receiveXpUpdated:
    action: receive
    channel:
      $ref: "#/channels/userRoom"
    summary: O usuário ganhou XP
    description: >
      Emitido para todos os dispositivos do usuário depois que uma Sessão de estudo concede XP. O app
      invalida o Dashboard (perfil, atividade recente e métricas), que também alimenta o Personagem.
    messages:
      - $ref: "#/channels/userRoom/messages/xpUpdated"
  receiveLevelUp:
    action: receive
    channel:
      $ref: "#/channels/userRoom"
    summary: O usuário subiu de Nível
    description: >
      Emitido depois de `progress:xpUpdated` quando o XP cruza o limite de um Nível. O app atualiza o
      Dashboard e o Catálogo de cosméticos, porque subir de Nível libera itens.
    messages:
      - $ref: "#/channels/userRoom/messages/levelUp"
  receiveEquipmentChanged:
    action: receive
    channel:
      $ref: "#/channels/userRoom"
    summary: O usuário equipou ou desequipou um Cosmetic Item
    description: >
      Emitido para todos os dispositivos do usuário depois do commit de Equipar ou desequipar. O app
      invalida o perfil (itens equipados e Título) e o Catálogo de cosméticos.
    messages:
      - $ref: "#/channels/userRoom/messages/equipmentChanged"
  receiveCoinsChanged:
    action: receive
    channel:
      $ref: "#/channels/userRoom"
    summary: O saldo de Moedas do usuário mudou
    description: >
      Emitido para todos os dispositivos do usuário depois do commit de um crédito ou débito de Moedas (ADR-012).
      Só sai quando a origem foi aplicada agora, e não quando a movimentação já tinha sido feita. O app atualiza o
      saldo e o Extrato.
    messages:
      - $ref: "#/channels/userRoom/messages/coinsChanged"
components:
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT enviado em `auth.token` no handshake do Socket.IO, não no header Authorization.
  messages:
    raidProgress:
      name: raid:progress
      title: Progresso da Raid
      contentType: application/json
      payload:
        $ref: "#/components/schemas/RaidProgress"
    raidComplete:
      name: notification:raidComplete
      title: Raid encerrada
      contentType: application/json
      payload:
        $ref: "#/components/schemas/RaidComplete"
    xpUpdated:
      name: progress:xpUpdated
      title: XP atualizado
      contentType: application/json
      payload:
        $ref: "#/components/schemas/XpUpdated"
    levelUp:
      name: notification:levelup
      title: Novo Nível
      contentType: application/json
      payload:
        $ref: "#/components/schemas/LevelUp"
    equipmentChanged:
      name: character:equipmentChanged
      title: Equipagem alterada
      contentType: application/json
      payload:
        $ref: "#/components/schemas/EquipmentChanged"
    coinsChanged:
      name: coins:changed
      title: Saldo de Moedas alterado
      contentType: application/json
      payload:
        $ref: "#/components/schemas/CoinsChanged"
  schemas:
    CoinsChanged:
      type: object
      required: [balance, delta, origin]
      properties:
        balance:
          type: integer
          minimum: 0
          description: Saldo do usuário depois da movimentação
        delta:
          type: integer
          description: Positivo para crédito, negativo para débito
        origin:
          type: object
          required: [type, ref]
          properties:
            type: { type: string, enum: [study-session, raid-win, purchase, signup, migration] }
            ref: { type: string, maxLength: 64 }
    EquipmentChanged:
      type: object
      required: [category, cosmeticItemId]
      properties:
        category:
          type: string
          enum: [avatar, badge, title, accessory]
          description: Categoria cuja equipagem mudou
        cosmeticItemId:
          type: [string, "null"]
          format: uuid
          description: Item agora equipado na categoria, ou null quando ela ficou vazia
    XpUpdated:
      type: object
      required: [xpGained, xpTotal, level]
      properties:
        xpGained:
          type: integer
          description: XP concedido pela Sessão de estudo
        xpTotal:
          type: integer
          description: XP acumulado do Personagem depois da concessão
        level:
          type: integer
          description: Nível do Personagem depois da concessão
    LevelUp:
      type: object
      required: [previousLevel, newLevel]
      properties:
        previousLevel:
          type: integer
        newLevel:
          type: integer
    RaidProgress:
      type: object
      required: [raidId, progressXp, goalXp, goalReachedAt]
      properties:
        raidId:
          type: string
          format: uuid
        progressXp:
          type: integer
          description: Soma das Contribuições da Raid
        goalXp:
          type: integer
          description: Meta coletiva, congelada na criação da Raid
        goalReachedAt:
          type: [string, "null"]
          format: date-time
          description: A primeira vez que o progresso alcançou a meta (Meta batida), ou null
    RaidComplete:
      type: object
      required: [raidId, guildId, status, rewardItemId]
      properties:
        raidId:
          type: string
          format: uuid
        guildId:
          type: string
          format: uuid
        status:
          type: string
          enum: [completed, expired]
          description: "`completed` com Meta batida (a Guild subiu um Nível), `expired` sem"
        rewardItemId:
          type: [string, "null"]
          format: uuid
          description: O Cosmetic Item recebido como Recompensa de Raid, ou null quando o usuário não recebeu nada
