openapi: "3.1.0"
info:
  title: Wise API
  version: "1.0.0"
  description: >
    Contrato REST da Fase 1 (dev/phase-1). Gerado a partir dos controllers
    NestJS reais em apps/backend/src/modules/**. Eventos WebSocket (Socket.IO)
    estão documentados separadamente em docs/api/asyncapi.yaml (pendente).
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:3000/api/v1
    description: Desenvolvimento local
security:
  - BearerAuth: []

paths:
  /health:
    get:
      summary: Liveness check
      operationId: getHealth
      tags: [Health]
      security: []
      responses:
        "200":
          description: Serviço no ar
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp]
                properties:
                  status: { type: string, enum: [ok] }
                  timestamp: { type: string, format: date-time }

  /auth/register:
    post:
      summary: Cria conta e sessão Web (ADR-009)
      description: >
        Transporte Web. O access token e o Session ID voltam no corpo; o
        refresh token rotativo é devolvido exclusivamente no cookie httpOnly
        `ww_refresh` e nunca no JSON.
      operationId: registerUser
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Conta criada; refresh no cookie httpOnly
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetRefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionTokenResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /auth/login:
    post:
      summary: Autentica e cria uma nova sessão Web (ADR-009)
      description: >
        Transporte Web. O access token e o Session ID voltam no corpo; o
        refresh token rotativo é devolvido exclusivamente no cookie httpOnly
        `ww_refresh` e nunca no JSON.
      operationId: loginUser
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Login válido; refresh no cookie httpOnly
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetRefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionTokenResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/refresh:
    post:
      summary: Rotaciona o refresh token do cookie httpOnly e emite novo access token
      description: >
        Transporte Web. Lê o refresh do cookie `ww_refresh`, rotaciona a
        Session e devolve novo access token e Session ID no corpo. O novo
        refresh token continua somente no cookie httpOnly.
      operationId: refreshSession
      tags: [Auth]
      security: []
      parameters:
        - { $ref: "#/components/parameters/RefreshCookie" }
      responses:
        "200":
          description: Novo access token emitido; cookie rotacionado
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetRefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionTokenResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      summary: Revoga a sessão do dispositivo atual
      description: >
        Transporte Web. Revoga a Session dona do cookie `ww_refresh` e limpa
        o cookie no path `/api/v1/auth`.
      operationId: logout
      tags: [Auth]
      security: []
      parameters:
        - name: ww_refresh
          in: cookie
          required: false
          description: >
            Credencial rotativa Web. Quando ausente, o servidor apenas limpa o
            cookie e responde 204.
          schema: { type: string }
      responses:
        "204":
          description: Sessão encerrada (idempotente); cookie de refresh limpo
          headers:
            Set-Cookie:
              description: Cookie `ww_refresh` limpo no path `/api/v1/auth`.
              schema: { type: string }

  /auth/native/register:
    post:
      summary: Cria conta e sessão para iOS/Android
      description: >
        Transporte nativo. Recebe e devolve a credencial rotativa pelo corpo
        para persistência no armazenamento seguro do dispositivo. Requisições
        com qualquer header `Origin` (inclusive `null`) são rejeitadas como
        defesa em profundidade; esse header não é prova de plataforma.
      operationId: nativeRegisterUser
      tags: [Auth, Native]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NativeRegisterRequest" }
      responses:
        "201":
          description: Conta criada; credencial rotativa no corpo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NativeSessionTokenResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /auth/native/login:
    post:
      summary: Autentica e cria uma sessão para iOS/Android
      description: >
        Transporte nativo. Recebe e devolve a credencial rotativa pelo corpo.
        Requisições com qualquer header `Origin` (inclusive `null`) são
        rejeitadas como defesa em profundidade.
      operationId: nativeLoginUser
      tags: [Auth, Native]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NativeLoginRequest" }
      responses:
        "200":
          description: Login válido; credencial rotativa no corpo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NativeSessionTokenResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /auth/native/refresh:
    post:
      summary: Rotaciona o refresh token enviado no corpo (iOS/Android)
      description: >
        Transporte nativo. A credencial rotativa entra e sai exclusivamente
        pelo corpo. Requisições com `Origin` são rejeitadas.
      operationId: nativeRefreshSession
      tags: [Auth, Native]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NativeRefreshRequest" }
      responses:
        "200":
          description: Credencial rotacionada no corpo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NativeSessionTokenResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /auth/native/logout:
    post:
      summary: Revoga a sessão a partir do refresh enviado no corpo (iOS/Android)
      description: >
        Transporte nativo. Revoga a Session dona do refresh apresentado no
        corpo. Requisições com `Origin` são rejeitadas.
      operationId: nativeLogout
      tags: [Auth, Native]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NativeRefreshRequest" }
      responses:
        "204": { description: Sessão encerrada }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /users/me:
    get:
      summary: Perfil do usuário autenticado
      operationId: getMyProfile
      tags: [Users]
      responses:
        "200":
          description: Perfil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/me/cosmetics/{itemId}:
    patch:
      summary: Equipa um item cosmético já desbloqueado
      operationId: equipCosmeticItem
      tags: [Users]
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Item equipado }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/me/sessions:
    get:
      summary: Lista dispositivos com sessão ativa (ADR-009)
      description: >
        Sem paginação por decisão explícita: o número de sessões simultâneas
        por usuário é limitado a MAX_SESSIONS_PER_USER (5, ver PRD ADR-009) —
        uma coleção nesse tamanho não justifica cursor/offset.
      operationId: listMySessions
      tags: [Users]
      responses:
        "200":
          description: Sessões ativas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SessionSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      summary: Encerra todas as sessões do usuário ("sair de todos os dispositivos")
      operationId: revokeAllMySessions
      tags: [Users]
      responses:
        "204": { description: Todas as sessões revogadas }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/me/sessions/{sessionId}:
    delete:
      summary: Encerra um dispositivo específico
      operationId: revokeMySession
      tags: [Users]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Sessão revogada }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /sessions:
    post:
      summary: Inicia uma Study Session solo
      description: >
        Aceita presets de 900, 1500 ou 3000 segundos; o padrão defensivo é
        1500. Idempotency-Key é única por usuário entre inícios e transições.
        Um replay idêntico devolve o snapshot original; reutilizar a chave por
        outro comando ou com duração diferente devolve conflito estável.
      operationId: startStudySession
      tags: [Sessions]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]{1,128}$' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartSessionRequest" }
      responses:
        "201":
          description: Sessão iniciada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudySessionSnapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/StudySessionStartConflict" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /sessions/active:
    get:
      summary: Consulta a Study Session ativa desta conta
      description: >
        Retorna 200 com o snapshot e canControl, ou 204 sem corpo quando não
        há sessão ativa. Outra Session autenticada pode consultar o snapshot,
        mas não pode controlar a Study Session.
      operationId: getActiveStudySession
      tags: [Sessions]
      responses:
        "200":
          description: Snapshot ativo; canControl indica se esta Session autenticada pode controlá-lo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudySessionSnapshot" }
        "204": { description: Nenhuma Study Session ativa }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /sessions/{id}/pause:
    post:
      summary: Pausa uma Study Session em andamento
      description: >
        A transição é confirmada pelo servidor e retorna o snapshot canônico.
        Requer Idempotency-Key e expectedVersion. Reenvios idênticos devolvem
        o snapshot original; a chave é única por usuário entre comandos.
        Uma versão obsoleta retorna conflito sem alterar a sessão.
      operationId: pauseStudySession
      tags: [Sessions]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]{1,128}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudySessionTransitionRequest" }
      responses:
        "200":
          description: Snapshot confirmado no estado paused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudySessionSnapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/StudySessionNotFound" }
        "409": { $ref: "#/components/responses/StudySessionPauseConflict" }

  /sessions/{id}/resume:
    post:
      summary: Retoma uma Study Session pausada
      description: >
        Retoma do tempo restante congelado pelo servidor e retorna um novo
        prazo canônico. Requer Idempotency-Key e expectedVersion. Reenvios
        idênticos devolvem o snapshot original; uma versão obsoleta retorna
        conflito sem alterar a sessão.
      operationId: resumeStudySession
      tags: [Sessions]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]{1,128}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudySessionTransitionRequest" }
      responses:
        "200":
          description: Snapshot confirmado no estado running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudySessionSnapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/StudySessionNotFound" }
        "409": { $ref: "#/components/responses/StudySessionResumeConflict" }

  /sessions/{id}/stop:
    post:
      summary: Cancela ou encerra antecipadamente uma Study Session
      description: >
        O servidor calcula o foco válido e decide `cancelled` abaixo de 300
        segundos ou `stopped_early` a partir de 300 segundos. A progressão,
        a sessão terminal, o recibo idempotente e a liberação da sessão ativa
        são confirmados em uma única transação. O prazo integral retorna conflito
        para que a conclusão seja feita pelo comando próprio. Requer
        Idempotency-Key e expectedVersion; respostas de retry preservam o
        snapshot original.
      operationId: stopStudySession
      tags: [Sessions]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]{1,128}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudySessionTransitionRequest" }
      responses:
        "200":
          description: Snapshot terminal confirmado, com a duração válida e o XP concedido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudySessionSnapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/StudySessionNotFound" }
        "409": { $ref: "#/components/responses/StudySessionStopConflict" }

  /sessions/recent:
    get:
      summary: Lista as últimas sessões encerradas do usuário autenticado
      operationId: listRecentStudySessions
      tags: [Sessions]
      responses:
        "200":
          description: Até cinco sessões encerradas, da mais recente para a mais antiga
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items: { $ref: "#/components/schemas/RecentStudySession" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /sessions/metrics:
    get:
      summary: Retorna métricas de consistência de estudo do usuário autenticado
      operationId: getStudySessionMetrics
      tags: [Sessions]
      responses:
        "200":
          description: Sequência atual, maior sequência histórica e cadência dos últimos 56 dias
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionMetrics" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /sessions/{id}/heartbeat:
    patch:
      summary: Pulso periódico do servidor (RN-ANTIFRAUDE — nunca o cliente marca o tempo)
      operationId: heartbeatStudySession
      tags: [Sessions]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Heartbeat registrado }
        "404": { $ref: "#/components/responses/StudySessionNotFound" }

  /sessions/{id}/complete:
    post:
      summary: Confirma a conclusão integral de uma Study Session canônica
      description: >
        A confirmação automática só é aceita quando o prazo canônico de foco
        foi alcançado. O servidor limita o foco à duração planejada, aplica a
        validação antifraude e atualiza sessão, progressão, referência ativa e
        recibo idempotente em uma única transação. Repetir a mesma chave e
        expectedVersion devolve o snapshot original. Registros legados sem
        estado canônico preservam o comportamento anterior.
      operationId: completeStudySession
      tags: [Sessions]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[!-~]{1,128}$'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudySessionTransitionRequest" }
      responses:
        "200":
          description: >
            Snapshot terminal canônico completed ou discarded. Para uma
            requisição legada sem estado canônico, o servidor preserva a
            resposta histórica StudySession.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/StudySessionSnapshot" }
                  - { $ref: "#/components/schemas/StudySession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/StudySessionNotFound" }
        "409":
          description: >
            Conclusão precoce, versão obsoleta, transição inválida, Session sem
            controle ou reutilização incompatível de Idempotency-Key.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                completionTooEarly:
                  summary: O prazo canônico ainda não foi alcançado
                  value:
                    type: https://wise.app/errors/study-session-completion-too-early
                    title: ConflictException
                    status: 409
                    detail: O prazo canônico da Study Session ainda não foi alcançado
                    instance: /api/v1/sessions/{id}/complete
                versionConflict:
                  summary: A versão esperada está obsoleta
                  value:
                    type: https://wise.app/errors/study-session-version-conflict
                    title: ConflictException
                    status: 409
                    detail: A Study Session mudou desde a última confirmação; atualize o snapshot antes de continuar
                    instance: /api/v1/sessions/{id}/complete
                transitionNotAllowed:
                  summary: O estado atual não permite conclusão
                  value:
                    type: https://wise.app/errors/study-session-transition-not-allowed
                    title: ConflictException
                    status: 409
                    detail: Não é possível concluir a Study Session no estado atual
                    instance: /api/v1/sessions/{id}/complete
                notControllable:
                  summary: A Session autenticada não iniciou o foco
                  value:
                    type: https://wise.app/errors/study-session-not-controllable
                    title: ConflictException
                    status: 409
                    detail: Esta Study Session só pode ser controlada pela Session autenticada que a iniciou
                    instance: /api/v1/sessions/{id}/complete
                idempotencyKeyReused:
                  summary: A chave já foi usada para outro comando
                  value:
                    type: https://wise.app/errors/idempotency-key-reused
                    title: ConflictException
                    status: 409
                    detail: Idempotency-Key já foi usada por outro comando
                    instance: /api/v1/sessions/{id}/complete

  /guilds:
    post:
      summary: Cria uma guilda (o criador se torna líder)
      operationId: createGuild
      tags: [Guilds]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGuildRequest" }
      responses:
        "201":
          description: Guilda criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Guild" }
        "409": { $ref: "#/components/responses/Conflict" }

  /guilds/{id}:
    get:
      summary: Detalhe de uma guilda
      operationId: getGuild
      tags: [Guilds]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Guilda
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuildDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /guilds/{id}/members:
    post:
      summary: Entra na guilda
      operationId: joinGuild
      tags: [Guilds]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Membro adicionado }
        "404": { $ref: "#/components/responses/NotFound" }

  /raids/{id}:
    get:
      summary: Detalhe de uma raid
      operationId: getRaid
      tags: [Raids]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Raid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RaidDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /raids/{id}/ranking:
    get:
      summary: Ranking de contribuição da raid
      description: >
        Sem paginação por decisão explícita: bounded pelo tamanho da guilda
        (tipicamente dezenas de membros, não milhares) — ver nota de
        /users/me/sessions acima para o mesmo raciocínio.
      operationId: getRaidRanking
      tags: [Raids]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Ranking ordenado por XP contribuído (desc)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RaidRankingEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /raids/{id}/join:
    post:
      summary: Confirma participação numa raid ativa da guilda do usuário (UC02)
      operationId: joinRaid
      tags: [Raids]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Participação confirmada }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    RefreshCookie:
      name: ww_refresh
      in: cookie
      required: true
      description: >
        Credencial rotativa do transporte Web. Fica exclusivamente em cookie
        httpOnly no path `/api/v1/auth`; nunca é legível por JavaScript.
      schema: { type: string }

  headers:
    SetRefreshCookie:
      description: >
        Refresh token rotativo do transporte Web. Atributos: `HttpOnly`,
        `SameSite=Lax`, `Path=/api/v1/auth`, `Secure` em produção e `Max-Age`
        alinhado a JWT_REFRESH_TTL_DAYS. O valor nunca aparece no corpo JSON.
      schema: { type: string }

  schemas:
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128 }
        displayName: { type: string, minLength: 2, maxLength: 60 }
        deviceLabel:
          type: string
          enum: [Wise Web]
          description: Rótulo previsível do dispositivo; a Web assume Wise Web.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        deviceLabel:
          type: string
          enum: [Wise Web]

    NativeRegisterRequest:
      type: object
      required: [email, password, displayName, deviceLabel]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128 }
        displayName: { type: string, minLength: 2, maxLength: 60 }
        deviceLabel: { type: string, enum: [Wise iOS, Wise Android] }

    NativeLoginRequest:
      type: object
      required: [email, password, deviceLabel]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        deviceLabel: { type: string, enum: [Wise iOS, Wise Android] }

    NativeRefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: Credencial opaca `sessionId.secret`, rotativa a cada uso.

    SessionTokenResponse:
      type: object
      required: [accessToken, sessionId]
      description: >
        Resposta do transporte Web. Só o access token e o Session ID são
        legíveis; o refresh permanece no cookie httpOnly.
      properties:
        accessToken: { type: string }
        sessionId: { type: string, format: uuid }

    NativeSessionTokenResponse:
      type: object
      required: [accessToken, refreshToken, sessionId]
      description: >
        Resposta do transporte nativo. O refresh só é devolvido no corpo dos
        endpoints `/auth/native/*`, para o SecureStore do dispositivo.
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        sessionId: { type: string, format: uuid }

    UserProfile:
      type: object
      description: >
        A projeção mantém a coerência do progresso: levelStartXp <= xpTotal <
        nextLevelXp.
      required: [id, email, displayName, planTier, level, levelStartXp, nextLevelXp, xpTotal, title]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        planTier: { type: string, enum: [free, premium] }
        level: { type: integer, minimum: 1 }
        levelStartXp:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Experiência inicial do nível atual, representada como inteiro seguro em JavaScript.
        nextLevelXp:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Experiência necessária para alcançar o próximo nível, representada como inteiro seguro em JavaScript.
        xpTotal:
          type: integer
          format: int64
          minimum: 0
          maximum: 9000000000000000
          description: Experiência total acumulada.
        title: { type: [string, "null"] }

    SessionSummary:
      type: object
      required: [id, deviceLabel, userAgent, createdAt, lastUsedAt]
      properties:
        id: { type: string, format: uuid }
        deviceLabel: { type: [string, "null"] }
        userAgent: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }

    StartSessionRequest:
      type: object
      additionalProperties: false
      properties:
        plannedDurationSeconds: { type: integer, enum: [900, 1500, 3000], default: 1500 }

    StudySessionTransitionRequest:
      type: object
      required: [expectedVersion]
      additionalProperties: false
      properties:
        expectedVersion: { type: integer, minimum: 1 }

    StudySessionSnapshot:
      type: object
      required: [id, mode, subject, state, plannedDurationSeconds, startedAt, runDeadlineAt, pausedAt, pausedTotalSeconds, durationValidSeconds, remainingSeconds, serverNow, version, endedAt, xpAwarded, terminalReason, discardedReason, canControl]
      properties:
        id: { type: string, format: uuid }
        mode: { type: string, enum: [solo] }
        subject: { type: "null" }
        state: { type: string, enum: [running, paused, completed, stopped_early, cancelled, discarded] }
        plannedDurationSeconds: { type: integer, enum: [900, 1500, 3000] }
        startedAt: { type: string, format: date-time }
        runDeadlineAt: { type: [string, "null"], format: date-time }
        pausedAt: { type: [string, "null"], format: date-time }
        pausedTotalSeconds: { type: integer, minimum: 0 }
        durationValidSeconds: { type: integer, minimum: 0 }
        remainingSeconds: { type: integer, minimum: 0 }
        serverNow: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        endedAt: { type: [string, "null"], format: date-time }
        xpAwarded: { type: integer, minimum: 0 }
        terminalReason: { type: [string, "null"], enum: [manual-stop, auto-complete, legacy-session-without-owner, null] }
        discardedReason: { type: [string, "null"] }
        canControl: { type: boolean }
      example:
        id: 00000000-0000-4000-8000-000000000074
        mode: solo
        subject: null
        state: running
        plannedDurationSeconds: 1500
        startedAt: "2026-09-23T12:00:00.000Z"
        runDeadlineAt: "2026-09-23T12:25:00.000Z"
        pausedAt: null
        pausedTotalSeconds: 0
        durationValidSeconds: 0
        remainingSeconds: 1500
        serverNow: "2026-09-23T12:00:00.000Z"
        version: 1
        endedAt: null
        xpAwarded: 0
        terminalReason: null
        discardedReason: null
        canControl: true

    StudySession:
      type: object
      required: [id, userId, subject, mode, startedAt, xpAwarded]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        subject: { type: [string, "null"] }
        mode: { type: string, enum: [solo, guild] }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, "null"], format: date-time }
        durationValidSeconds: { type: integer, minimum: 0 }
        xpAwarded: { type: integer, minimum: 0 }
        discardedReason:
          type: [string, "null"]
          enum: [continuous-session-exceeds-limit, daily-limit-exceeded, null]

    RecentStudySession:
      type: object
      required: [id, subject, mode, state, startedAt, endedAt, durationValidSeconds, xpAwarded, discardedReason]
      properties:
        id: { type: string, format: uuid }
        subject: { type: [string, "null"] }
        mode: { type: string, enum: [solo, guild] }
        state: { type: [string, "null"], enum: [running, paused, completed, stopped_early, cancelled, discarded, null] }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        durationValidSeconds: { type: integer, minimum: 0 }
        xpAwarded: { type: integer, minimum: 0 }
        discardedReason:
          type: [string, "null"]
          enum: [continuous-session-exceeds-limit, daily-limit-exceeded, null]

    SessionMetrics:
      type: object
      description: Métricas calculadas no calendário UTC; sessões ativas ou descartadas não são contabilizadas.
      required: [currentStreakDays, longestStreakDays, sessionsToday, dailyGoal, validSecondsToday, cadence]
      properties:
        currentStreakDays: { type: integer, minimum: 0 }
        longestStreakDays: { type: integer, minimum: 0 }
        sessionsToday: { type: integer, minimum: 0 }
        dailyGoal: { type: integer, const: 4 }
        validSecondsToday: { type: integer, minimum: 0 }
        cadence: { $ref: "#/components/schemas/SessionMetricsCadence" }

    SessionMetricsCadence:
      type: object
      description: Janela inclusiva de 56 dias consecutivos no calendário UTC.
      required: [windowStart, windowEnd, days]
      properties:
        windowStart: { type: string, format: date }
        windowEnd: { type: string, format: date }
        days:
          type: array
          minItems: 56
          maxItems: 56
          items: { $ref: "#/components/schemas/SessionMetricsCadenceDay" }

    SessionMetricsCadenceDay:
      type: object
      required: [date, sessionCount, validSeconds, intensity]
      properties:
        date: { type: string, format: date }
        sessionCount: { type: integer, minimum: 0 }
        validSeconds: { type: integer, minimum: 0 }
        intensity: { type: integer, enum: [0, 1, 2, 3, 4] }

    CreateGuildRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 3, maxLength: 60 }

    Guild:
      type: object
      required: [id, name, level, createdBy]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        level: { type: integer }
        createdBy: { type: string, format: uuid }

    GuildDetail:
      type: object
      required: [id, name, level, memberCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        level: { type: integer }
        memberCount: { type: integer }

    RaidDetail:
      type: object
      required: [id, title, goalXp, progressXp, endsAt, status]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        goalXp: { type: integer }
        progressXp: { type: integer }
        endsAt: { type: string, format: date-time }
        status: { type: string, enum: [active, completed, expired] }

    RaidRankingEntry:
      type: object
      required: [userId, xpContributed]
      properties:
        userId: { type: string, format: uuid }
        xpContributed: { type: integer }

    Problem:
      type: object
      required: [type, title, status, detail, instance]
      description: RFC 7807 — formato de erro de toda a API (ver HttpExceptionFilter)
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }

  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Credenciais ou token ausentes/inválidos
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Autenticado, mas sem permissão sobre o recurso
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Recurso não encontrado
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    StudySessionNotFound:
      description: >
        Study Session inexistente ou pertencente a outro usuário. Ambos os
        casos usam o mesmo status e detalhe e não incluem dados do recurso.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: "Conflito de estado (ex.: e-mail/nome já em uso)"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    StudySessionStartConflict:
      description: Study Session ativa ou reutilização incompatível de Idempotency-Key.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            activeStudySession:
              summary: Já existe uma Study Session ativa para este usuário
              value:
                type: https://wise.app/errors/study-session-active
                title: ConflictException
                status: 409
                detail: Já existe uma Study Session ativa nesta conta
                instance: /api/v1/sessions
            idempotencyKeyReused:
              summary: A chave pertence a outro comando ou duração
              value:
                type: https://wise.app/errors/idempotency-key-reused
                title: ConflictException
                status: 409
                detail: Idempotency-Key já foi usada por outro comando
                instance: /api/v1/sessions
    # Keep operation examples local: each RFC 7807 `instance` names its route.
    StudySessionPauseConflict:
      description: >
        Versão obsoleta, transição inválida, prazo vencido, falta de controle
        pela Session iniciadora ou chave já usada por outro comando.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            versionConflict:
              summary: A versão esperada está obsoleta
              value:
                type: https://wise.app/errors/study-session-version-conflict
                title: ConflictException
                status: 409
                detail: A Study Session mudou desde a última confirmação; atualize o snapshot antes de continuar
                instance: /api/v1/sessions/{id}/pause
            transitionNotAllowed:
              summary: O estado atual não permite pausar
              value:
                type: https://wise.app/errors/study-session-transition-not-allowed
                title: ConflictException
                status: 409
                detail: Não é possível pausar a Study Session no estado atual
                instance: /api/v1/sessions/{id}/pause
            deadlinePassed:
              summary: O prazo já terminou
              value:
                type: https://wise.app/errors/study-session-deadline-passed
                title: ConflictException
                status: 409
                detail: O prazo canônico da Study Session já terminou
                instance: /api/v1/sessions/{id}/pause
            notControllable:
              summary: A Session autenticada não iniciou o foco
              value:
                type: https://wise.app/errors/study-session-not-controllable
                title: ConflictException
                status: 409
                detail: Esta Study Session só pode ser controlada pela Session autenticada que a iniciou
                instance: /api/v1/sessions/{id}/pause
            idempotencyKeyReused:
              summary: A chave já foi usada por outro comando
              value:
                type: https://wise.app/errors/idempotency-key-reused
                title: ConflictException
                status: 409
                detail: Idempotency-Key já foi usada por outro comando
                instance: /api/v1/sessions/{id}/pause
    StudySessionResumeConflict:
      description: Versão obsoleta, transição inválida, falta de controle ou chave incompatível.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            versionConflict:
              summary: A versão esperada está obsoleta
              value:
                type: https://wise.app/errors/study-session-version-conflict
                title: ConflictException
                status: 409
                detail: A Study Session mudou desde a última confirmação; atualize o snapshot antes de continuar
                instance: /api/v1/sessions/{id}/resume
            transitionNotAllowed:
              summary: O estado atual não permite retomar
              value:
                type: https://wise.app/errors/study-session-transition-not-allowed
                title: ConflictException
                status: 409
                detail: Não é possível retomar a Study Session no estado atual
                instance: /api/v1/sessions/{id}/resume
            notControllable:
              summary: A Session autenticada não iniciou o foco
              value:
                type: https://wise.app/errors/study-session-not-controllable
                title: ConflictException
                status: 409
                detail: Esta Study Session só pode ser controlada pela Session autenticada que a iniciou
                instance: /api/v1/sessions/{id}/resume
            idempotencyKeyReused:
              summary: A chave já foi usada por outro comando
              value:
                type: https://wise.app/errors/idempotency-key-reused
                title: ConflictException
                status: 409
                detail: Idempotency-Key já foi usada por outro comando
                instance: /api/v1/sessions/{id}/resume
    StudySessionStopConflict:
      description: Prazo integral, versão obsoleta, transição inválida, falta de controle ou chave incompatível.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            deadlinePassed:
              summary: O prazo integral exige o comando de conclusão
              value:
                type: https://wise.app/errors/study-session-deadline-passed
                title: ConflictException
                status: 409
                detail: O prazo canônico da Study Session já terminou
                instance: /api/v1/sessions/{id}/stop
            versionConflict:
              summary: A versão esperada está obsoleta
              value:
                type: https://wise.app/errors/study-session-version-conflict
                title: ConflictException
                status: 409
                detail: A Study Session mudou desde a última confirmação; atualize o snapshot antes de continuar
                instance: /api/v1/sessions/{id}/stop
            transitionNotAllowed:
              summary: O estado atual não permite encerrar
              value:
                type: https://wise.app/errors/study-session-transition-not-allowed
                title: ConflictException
                status: 409
                detail: Não é possível encerrar a Study Session no estado atual
                instance: /api/v1/sessions/{id}/stop
            notControllable:
              summary: A Session autenticada não iniciou o foco
              value:
                type: https://wise.app/errors/study-session-not-controllable
                title: ConflictException
                status: 409
                detail: Esta Study Session só pode ser controlada pela Session autenticada que a iniciou
                instance: /api/v1/sessions/{id}/stop
            idempotencyKeyReused:
              summary: A chave já foi usada por outro comando
              value:
                type: https://wise.app/errors/idempotency-key-reused
                title: ConflictException
                status: 409
                detail: Idempotency-Key já foi usada por outro comando
                instance: /api/v1/sessions/{id}/stop
