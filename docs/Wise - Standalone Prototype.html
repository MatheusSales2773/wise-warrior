<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wise — Protótipo Interativo</title>
<meta name="description" content="Mock interativo, single-file, do que já está implementado (auth, dashboard M4) e do que está no PRD mas ainda não foi construído no app real (Forja, Perfil, Guilda).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Wise — Dark Fantasy Modern
   Tokens copiados 1:1 de apps/frontend/src/design-system/tokens/theme.ts
   (fonte real do app Expo em produção) — não são valores inventados
   pra este mock.
   ============================================================ */
:root {
  --bg-void: #07070c;      /* ink900 / backgroundCanvas */
  --bg-deep: #0c0c14;      /* ink800 / backgroundRaised */
  --bg-elevated: #12121c;  /* ink700 / backgroundOverlay */
  --bg-card: #181826;      /* indigo600 / surfaceCard */
  --bg-card-hover: #1f1f2e;/* indigo500 / surfaceElevated */
  --bg-inset: #0a0a12;     /* inkInset / surfaceInset */

  --line-faint: rgba(212, 168, 90, 0.08);
  --line-soft: rgba(212, 168, 90, 0.16);
  --line: rgba(212, 168, 90, 0.28);
  --line-strong: rgba(212, 168, 90, 0.45);

  --accent: #d4a85a;        /* accentPrimary */
  --accent-bright: #f0c97a; /* accentHighlight */
  --accent-dim: #8a6a3a;    /* accentMuted */
  --accent-glow: rgba(212, 168, 90, 0.35);

  --danger: #c44545;
  --info: #5b7fc4;
  --success: #4ea672;
  --energy: #d65a8a;
  --arcane: #8a5bc4;

  --text: #f3ead4;        /* textPrimary */
  --text-dim: #b3a98e;    /* textSecondary */
  --text-mute: #6b6555;   /* textTertiary */
  --text-faint: #46412f;  /* textDisabled */

  --shadow-card: 0 1px 0 rgba(255, 240, 200, 0.04) inset, 0 8px 24px -8px rgba(0,0,0,0.5);
  --shadow-glow: 0 0 0 1px var(--line), 0 0 24px -8px var(--accent-glow);

  --radius-sm: 3px;
  --radius: 5px;
  --radius-md: 8px;
  --radius-lg: 12px;

  --font-display: "Cinzel", "Trajan Pro", serif;
  --font-body: "Inter", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;

  --sidebar-width: 248px;
  --bottom-nav-height: 76px;
  --desktop-breakpoint: 900px;
  --touch-target: 44px;
}

* { box-sizing: border-box; }
html, body, #root { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-body);
  background: var(--bg-void);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "ss01", "cv11";
}

/* Textura sutil — ruído fractal + vinheta radial. Não é grid decorativo:
   é um filtro feTurbulence de baixa opacidade, textura de pergaminho. */
body::before {
  content: "";
  position: fixed; inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 20% 0%, var(--accent-glow), transparent 50%),
    radial-gradient(ellipse at 100% 100%, rgba(91, 127, 196, 0.08), transparent 60%);
  opacity: 0.35;
  z-index: 0;
  mix-blend-mode: screen;
}
body::after {
  content: "";
  position: fixed; inset: 0;
  pointer-events: none;
  background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScyMDAnIGhlaWdodD0nMjAwJz48ZmlsdGVyIGlkPSduJz48ZmVUdXJidWxlbmNlIHR5cGU9J2ZyYWN0YWxOb2lzZScgYmFzZUZyZXF1ZW5jeT0nMC44NScgbnVtT2N0YXZlcz0nMicgc2VlZD0nNScvPjxmZUNvbG9yTWF0cml4IHZhbHVlcz0nMCAwIDAgMCAwLjkgMCAwIDAgMCAwLjg1IDAgMCAwIDAgMC42NSAwIDAgMCAwLjE4IDAnLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0nMjAwJyBoZWlnaHQ9JzIwMCcgZmlsdGVyPSd1cmwoI24pJy8+PC9zdmc+");
  opacity: 0.45;
  z-index: 0;
  mix-blend-mode: overlay;
}

.display { font-family: var(--font-display); letter-spacing: 0.06em; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.smallcaps { text-transform: uppercase; letter-spacing: 0.16em; font-size: 11px; color: var(--text-dim); }
.smallcaps-accent { text-transform: uppercase; letter-spacing: 0.18em; font-size: 11px; color: var(--accent); font-weight: 600; }
h1, h2, h3, h4 { margin: 0; font-family: var(--font-display); font-weight: 600; letter-spacing: 0.04em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; }

/* Selo de fidelidade — marca se a tela espelha o app real ou é visão do PRD */
.fidelity {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase;
  padding: 3px 9px; border-radius: 999px; border: 1px solid;
}
.fidelity.real { color: var(--success); border-color: rgba(78,166,114,0.4); background: rgba(78,166,114,0.08); }
.fidelity.vision { color: var(--accent-bright); border-color: var(--line); background: rgba(212,168,90,0.06); }
.fidelity .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

/* ========== App shell (responsivo) ========== */
.app { position: relative; z-index: 1; min-height: 100vh; }
.app-body { display: flex; min-height: 100vh; }

.sidebar {
  width: var(--sidebar-width); flex-shrink: 0;
  background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-void) 100%);
  border-right: 1px solid var(--line-soft);
  display: flex; flex-direction: column;
  padding: 22px 16px 18px;
  position: relative;
}
.brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 22px; border-bottom: 1px dashed var(--line-faint); margin-bottom: 18px; cursor: pointer; background: none; border-top: none; border-left: none; border-right: none; text-align: left; color: inherit; width: 100%; }
.brand-sigil { width: 36px; height: 36px; display: grid; place-items: center; color: var(--accent); flex-shrink: 0; }
.brand-name { font-family: var(--font-display); font-size: 15px; letter-spacing: 0.24em; font-weight: 700; color: var(--text); }
.brand-tag { font-size: 9px; letter-spacing: 0.32em; color: var(--text-mute); text-transform: uppercase; }

.nav-group-label { font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--text-faint); padding: 18px 12px 8px; font-weight: 600; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 12px; min-height: var(--touch-target);
  border-radius: var(--radius); color: var(--text-dim);
  cursor: pointer; font-size: 13px; letter-spacing: 0.02em;
  position: relative; transition: color 0.15s, background 0.15s;
  background: none; border: none; width: 100%; text-align: left; font-family: var(--font-body);
}
.nav-item:hover, .nav-item:focus-visible { color: var(--text); background: var(--bg-card); }
.nav-item.active { color: var(--accent-bright); background: linear-gradient(90deg, var(--bg-card) 0%, transparent 100%); }
.nav-item.active::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 2px; background: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
.nav-item.disabled { color: var(--text-faint); cursor: default; }
.nav-item .nav-icon { width: 18px; height: 18px; opacity: 0.85; flex-shrink: 0; display: grid; place-items: center; }
.nav-item .nav-badge { margin-left: auto; font-family: var(--font-mono); font-size: 9px; padding: 2px 7px; border-radius: 999px; background: var(--bg-inset); border: 1px solid var(--line-faint); color: var(--text-mute); letter-spacing: 0.08em; }

.sidebar-foot { margin-top: auto; padding-top: 14px; border-top: 1px dashed var(--line-faint); display: flex; flex-direction: column; gap: 10px; }
.mini-char { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: var(--radius); background: var(--bg-card); border: 1px solid var(--line-soft); }
.avatar { width: 36px; height: 36px; border-radius: 4px; background: linear-gradient(135deg, var(--accent-dim), var(--bg-elevated)); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; color: var(--accent-bright); font-size: 14px; flex-shrink: 0; }
.mini-char-name { font-family: var(--font-display); font-size: 12px; letter-spacing: 0.06em; font-weight: 600; color: var(--text); }
.mini-char-meta { font-size: 10px; color: var(--text-mute); letter-spacing: 0.06em; }
.mini-char-bars { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }

.btn-logout { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--touch-target); padding: 0 14px; border-radius: var(--radius); border: 1px solid rgba(196,69,69,0.35); background: rgba(196,69,69,0.08); color: var(--danger); font-family: var(--font-display); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer; transition: background 0.15s; }
.btn-logout:hover { background: rgba(196,69,69,0.16); }

.page { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; background: radial-gradient(ellipse 80% 60% at 50% 0%, var(--bg-deep), var(--bg-void) 80%); }
.topbar { display: flex; align-items: center; gap: 16px; padding: 18px 32px; border-bottom: 1px solid var(--line-soft); background: linear-gradient(180deg, var(--bg-deep), transparent); flex-wrap: wrap; }
.topbar-title { display: flex; flex-direction: column; gap: 6px; }
.topbar h1 { font-size: 18px; letter-spacing: 0.18em; color: var(--text); text-transform: uppercase; }
.topbar .breadcrumb-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.topbar .breadcrumb { font-size: 10px; letter-spacing: 0.2em; color: var(--text-mute); text-transform: uppercase; }
.topbar-spacer { flex: 1; }
.resource-pill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border: 1px solid var(--line-soft); background: var(--bg-card); border-radius: 4px; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; }
.resource-pill .dot { width: 6px; height: 6px; border-radius: 50%; }
.resource-pill.gold { color: var(--accent-bright); }
.resource-pill.gold .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }

.page-body { flex: 1; overflow-y: auto; padding: 28px 32px calc(60px + env(safe-area-inset-bottom, 0px)); }
.page-body::-webkit-scrollbar { width: 8px; }
.page-body::-webkit-scrollbar-thumb { background: var(--line-soft); border-radius: 4px; }
.page-body::-webkit-scrollbar-track { background: transparent; }

/* ========== Bottom nav (mobile/narrow web, <900px) ========== */
.bottom-nav { display: none; }
.more-menu-backdrop { display: none; }

@media (max-width: 899px) {
  .sidebar { display: none; }
  .page-body { padding: 20px 16px calc(var(--bottom-nav-height) + 24px + env(safe-area-inset-bottom, 0px)); }
  .topbar { padding: 16px 16px; }
  .bottom-nav {
    display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    height: calc(var(--bottom-nav-height) + env(safe-area-inset-bottom, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--bg-deep); border-top: 1px solid var(--line-soft);
    justify-content: space-around; align-items: stretch;
  }
  .bottom-nav button {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    background: none; border: none; color: var(--text-mute); font-family: var(--font-body); font-size: 10px;
    letter-spacing: 0.04em; cursor: pointer; min-height: var(--touch-target);
  }
  .bottom-nav button.active { color: var(--accent-bright); }
  .more-menu-backdrop {
    display: flex; position: fixed; inset: 0; z-index: 60; align-items: flex-end; justify-content: center;
    background: rgba(7,7,12,0.6); backdrop-filter: blur(2px);
  }
  .more-menu {
    width: 100%; max-width: 480px; background: var(--bg-elevated); border: 1px solid var(--line-soft);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: 10px 10px calc(20px + env(safe-area-inset-bottom, 0px));
  }
  .more-menu-handle { width: 36px; height: 4px; border-radius: 999px; background: var(--line); margin: 6px auto 14px; }
}
@media (min-width: 900px) {
  .dashboard, .profile, .guild { grid-template-columns: 1fr 320px !important; }
}

/* ========== Cards ========== */
.card { background: var(--bg-card); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 22px; position: relative; box-shadow: var(--shadow-card); }
.card.framed { background: linear-gradient(var(--bg-card), var(--bg-card)) padding-box, linear-gradient(135deg, var(--line) 0%, transparent 30%, transparent 70%, var(--line) 100%) border-box; border: 1px solid transparent; }
.card-corner { position: absolute; width: 14px; height: 14px; border-color: var(--line); pointer-events: none; }
.card-corner.tl { top: -1px; left: -1px; border-top: 1px solid; border-left: 1px solid; }
.card-corner.tr { top: -1px; right: -1px; border-top: 1px solid; border-right: 1px solid; }
.card-corner.bl { bottom: -1px; left: -1px; border-bottom: 1px solid; border-left: 1px solid; }
.card-corner.br { bottom: -1px; right: -1px; border-bottom: 1px solid; border-right: 1px solid; }
.card-corner::before, .card-corner::after { content: ""; position: absolute; background: var(--accent); }
.card-corner.tl::before { top: -1px; left: -1px; width: 5px; height: 1px; } .card-corner.tl::after { top: -1px; left: -1px; width: 1px; height: 5px; }
.card-corner.tr::before { top: -1px; right: -1px; width: 5px; height: 1px; } .card-corner.tr::after { top: -1px; right: -1px; width: 1px; height: 5px; }
.card-corner.bl::before { bottom: -1px; left: -1px; width: 5px; height: 1px; } .card-corner.bl::after { bottom: -1px; left: -1px; width: 1px; height: 5px; }
.card-corner.br::before { bottom: -1px; right: -1px; width: 5px; height: 1px; } .card-corner.br::after { bottom: -1px; right: -1px; width: 1px; height: 5px; }
.card-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
.card-title h3 { font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.card-title .ornament { color: var(--accent-dim); font-size: 10px; letter-spacing: 0.2em; }
.bullet-diamond { display: inline-block; width: 5px; height: 5px; background: var(--accent); transform: rotate(45deg); margin: 0 8px; }

/* ========== Buttons ========== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--touch-target); padding: 0 22px; border: 1px solid var(--line); background: var(--bg-card); color: var(--text); font-family: var(--font-display); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; border-radius: var(--radius-sm); transition: all 0.15s; position: relative; }
.btn:hover { background: var(--bg-card-hover); color: var(--accent-bright); border-color: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn:active:not(:disabled) { transform: scale(0.98); }
.btn.primary { background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dim) 100%); color: #0a0a0a; border-color: var(--accent-bright); font-weight: 700; box-shadow: 0 0 24px -6px var(--accent-glow); }
.btn.primary:hover { filter: brightness(1.1); color: #0a0a0a; }
.btn.ghost { background: transparent; }
.btn.danger { border-color: rgba(196,69,69,0.4); color: var(--danger); background: rgba(196,69,69,0.06); }
.btn.danger:hover { background: rgba(196,69,69,0.14); border-color: var(--danger); color: var(--danger); }
.btn.small { min-height: 34px; padding: 0 14px; font-size: 10px; }
.btn.icon-only { padding: 0; width: var(--touch-target); height: var(--touch-target); }
.btn.block { width: 100%; }

/* ========== Progress bars ========== */
.bar { position: relative; height: 8px; background: var(--bg-inset); border: 1px solid var(--line-soft); border-radius: 2px; overflow: hidden; }
.bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent-dim), var(--accent)); box-shadow: 0 0 12px -2px var(--accent-glow); position: relative; transition: width 0.6s ease-out; }
.bar.thin { height: 4px; } .bar.tall { height: 12px; }
.bar-row { display: flex; align-items: center; gap: 10px; font-size: 10px; letter-spacing: 0.1em; color: var(--text-dim); }
.bar-row .label { width: 28px; font-weight: 700; }
.bar-row .value { font-family: var(--font-mono); font-size: 11px; color: var(--text); }
.bar-row .bar { flex: 1; }

/* ========== Stat tiles ========== */
.stat-tile { padding: 18px 20px; background: var(--bg-card); border: 1px solid var(--line-soft); border-radius: var(--radius); display: flex; flex-direction: column; gap: 4px; position: relative; overflow: hidden; }
.stat-tile::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--line-strong), transparent); }
.stat-tile .stat-label { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-mute); }
.stat-tile .stat-value { font-family: var(--font-display); font-size: 28px; font-weight: 700; color: var(--text); letter-spacing: 0.04em; line-height: 1; margin: 4px 0; }
.stat-tile .stat-trend { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); }
.stat-tile .stat-icon { position: absolute; right: 14px; top: 14px; opacity: 0.3; color: var(--accent); }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.col { display: flex; flex-direction: column; gap: 18px; }
@media (max-width: 640px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

/* ========== Dashboard ========== */
.dashboard { display: grid; grid-template-columns: 1fr; gap: 22px; }
.hero-card { padding: 28px 32px; background: linear-gradient(120deg, var(--bg-card) 0%, var(--bg-elevated) 100%); border: 1px solid var(--line); border-radius: var(--radius); display: flex; align-items: center; justify-content: space-between; gap: 24px; position: relative; overflow: hidden; flex-wrap: wrap; }
.hero-card::before { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 50%; background: radial-gradient(circle at 80% 50%, var(--accent-glow), transparent 60%); pointer-events: none; }
.hero-greeting { font-family: var(--font-display); font-size: 9px; letter-spacing: 0.32em; color: var(--accent); text-transform: uppercase; }
.hero-title { font-family: var(--font-display); font-size: 26px; font-weight: 600; letter-spacing: 0.04em; color: var(--text); margin: 6px 0 4px; }
.hero-sub { font-size: 13px; color: var(--text-dim); max-width: 480px; line-height: 1.6; }

.status-line { font-size: 11px; color: var(--text-mute); letter-spacing: 0.08em; min-height: 16px; transition: color 0.2s; }
.status-line.updating { color: var(--accent); }
.status-line.updated { color: var(--success); }

.activity { display: flex; align-items: flex-start; gap: 14px; padding: 10px 0; border-bottom: 1px dashed var(--line-faint); position: relative; }
.activity:last-child { border-bottom: none; }
.activity-main { flex: 1; min-width: 0; }
.activity-subject { font-size: 12px; color: var(--text); font-weight: 500; }
.activity-meta { font-size: 10px; color: var(--text-mute); letter-spacing: 0.06em; margin-top: 3px; }
.activity-xp { font-family: var(--font-mono); font-size: 12px; color: var(--accent-bright); font-weight: 600; flex-shrink: 0; }
.activity-discarded { font-family: var(--font-mono); font-size: 11px; color: var(--danger); flex-shrink: 0; }
.empty-state { font-size: 12px; color: var(--text-mute); line-height: 1.6; padding: 8px 0; }

.streak-grid { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; }
.streak-cell { aspect-ratio: 1; background: var(--bg-inset); border-radius: 2px; border: 1px solid var(--line-faint); }
.streak-cell.l1 { background: rgba(212,168,90,0.15); }
.streak-cell.l2 { background: rgba(212,168,90,0.3); }
.streak-cell.l3 { background: rgba(212,168,90,0.55); }
.streak-cell.l4 { background: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }

.subject-pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--bg-inset); border: 1px solid var(--line-faint); border-radius: 999px; font-size: 11px; letter-spacing: 0.08em; color: var(--text-dim); cursor: pointer; min-height: 32px; }
.subject-pill:hover { border-color: var(--line); color: var(--text); }
.subject-pill.active { color: var(--accent); border-color: var(--line); background: rgba(212,168,90,0.08); }
.subject-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

.section-head { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
.section-head h2 { font-size: 13px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--text); font-weight: 600; }
.section-head .line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }

/* ========== Pomodoro ========== */
.pomodoro { display: grid; grid-template-columns: 1fr; gap: 24px; }
@media (min-width: 900px) { .pomodoro { grid-template-columns: 1fr 320px; } }
.pomodoro-stage { background: var(--bg-card); border: 1px solid var(--line-soft); border-radius: var(--radius-md); position: relative; overflow: hidden; display: flex; flex-direction: column; }
.pomodoro-stage::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, var(--accent-glow), transparent 50%); opacity: 0.6; pointer-events: none; }

.ambient-item:hover { background: var(--bg-card-hover); }
.ambient-item.active { color: var(--accent-bright); background: var(--bg-card-hover); }
.ambient-item .glyph { width: 22px; height: 22px; display: grid; place-items: center; color: var(--accent); }
.ambient-item .play-state { margin-left: auto; font-size: 9px; letter-spacing: 0.2em; color: var(--accent); }

/* ========== Profile ========== */
.profile { display: grid; grid-template-columns: 1fr; gap: 22px; }
@media (min-width: 900px) { .profile { grid-template-columns: 320px 1fr; } }
.character-panel { background: var(--bg-card); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 22px; display: flex; flex-direction: column; gap: 18px; position: relative; }
.character-portrait { aspect-ratio: 3/4; background: linear-gradient(180deg, var(--bg-inset), var(--bg-deep)); border: 1px solid var(--line); border-radius: var(--radius-sm); position: relative; overflow: hidden; display: grid; place-items: center; }
.character-portrait::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 40%, var(--bg-void) 95%); }
.character-silhouette { color: var(--accent-dim); opacity: 0.7; position: relative; z-index: 1; }
.character-title-banner { text-align: center; font-family: var(--font-display); font-size: 14px; letter-spacing: 0.16em; color: var(--accent-bright); padding: 6px 0; border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line-faint); overflow-x: auto; }
.tab { padding: 11px 18px; font-family: var(--font-display); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-mute); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color 0.15s; white-space: nowrap; min-height: var(--touch-target); display: flex; align-items: center; background: none; border-left: none; border-right: none; border-top: none; font-family: var(--font-display); }

.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.cosmetics-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 10px; }
.cosmetic-slot { aspect-ratio: 1; background: var(--bg-inset); border: 1px solid var(--line-faint); border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px; cursor: pointer; transition: all 0.15s; position: relative; }
.cosmetic-slot.unlocked { border-color: var(--line); color: var(--accent-bright); }
.cosmetic-slot.locked { color: var(--text-faint); cursor: default; }
.cosmetic-slot.equipped { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 16px -4px var(--accent-glow); }
.cosmetic-slot .label { font-size: 8px; letter-spacing: 0.06em; text-align: center; text-transform: uppercase; line-height: 1.2; }
.cosmetic-slot .premium-tag { position: absolute; top: 4px; right: 4px; font-size: 7px; color: var(--accent); }

.locked-feature { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 40px 20px; text-align: center; color: var(--text-mute); }

.session-info { flex: 1; min-width: 160px; }
.session-device { font-size: 13px; color: var(--text); font-weight: 500; }
.session-meta { font-size: 10px; color: var(--text-mute); letter-spacing: 0.04em; margin-top: 2px; }
.session-current { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--success); border: 1px solid rgba(78,166,114,0.35); background: rgba(78,166,114,0.08); padding: 2px 8px; border-radius: 999px; }

.xp-toast .bot { font-size: 13px; color: var(--text); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

    const [name, setName] = useState('');

    const [password, setPassword] = useState('');
    const [confirm, setConfirm] = useState('');

    function validate() {
      const err = {};
      const n = name.trim();
      if (!n) err.name = 'Informe seu nome.';
      else if (n.length < 2 || n.length > 60) err.name = 'Use entre 2 e 60 caracteres.';
      if (!email.trim()) err.email = 'Informe seu e-mail.';
      else if (!/^\S+@\S+\.\S+$/.test(email.trim())) err.email = 'Use um e-mail válido.';
      if (!password) err.password = 'Informe sua senha.';
      else if (password.length < 8 || password.length > 128) err.password = 'Use entre 8 e 128 caracteres.';
      if (!confirm) err.confirm = 'Confirme sua senha.';
      else if (confirm !== password) err.confirm = 'As senhas precisam ser iguais.';
      return err;

  /* ====================== FORJA — Pomodoro (visão do PRD) ====================== */
  function Pomodoro({ onComplete, subject, setSubject, totalMin = 25 }) {
    const TOTAL = totalMin * 60;
    const [remaining, setRemaining] = useState(TOTAL);
    const [running, setRunning] = useState(true);
    const [ambient, setAmbient] = useState('forest');
    const phase = remaining > TOTAL * 0.5 ? 'AQUECIMENTO' : remaining > TOTAL * 0.15 ? 'FOCO PROFUNDO' : 'FORJA FINAL';

    useEffect(() => {
      if (!running) return;
      const id = setInterval(() => {
        setRemaining((r) => {
          if (r <= 1) {
            clearInterval(id);
            const earnedXp = xpForDuration(TOTAL);
            onComplete && onComplete(earnedXp);
            return 0;
          }
          return r - 1;
        });
      }, 1000);
      return () => clearInterval(id);
    }, [running, TOTAL, onComplete]);

    useEffect(() => { setRemaining(TOTAL); }, [TOTAL]);

    const mm = String(Math.floor(remaining / 60)).padStart(2, '0');
    const ss = String(remaining % 60).padStart(2, '0');
    const progress = 1 - remaining / TOTAL;
    const R = 154, C = 2 * Math.PI * R;

    const party = [
      { name: 'Você', task: subject, time: mm + ':' + ss, you: true },
      { name: 'Eldoria', task: 'Direito Constitucional', time: '14:22' },
      { name: 'Ravenstone', task: 'Cálculo II', time: '09:48' },

    const subjects = ['Cálculo II', 'Algoritmos', 'História', 'Inglês'];
    const ambients = [
      { id: 'forest', label: 'Floresta antiga', icon: I.leaf },
      { id: 'tavern', label: 'Taverna distante', icon: I.flame },

            e('div', { style: { display: 'flex', gap: 6, flexWrap: 'wrap' } },
              subjects.map((s) => e('div', { key: s, className: 'subject-pill' + (s === subject ? ' active' : ''), onClick: () => setSubject(s) }, e('span', { className: 'dot' }), s)),

            e('svg', { className: 'timer-ring', viewBox: '0 0 340 340' },
              e('defs', null, e('linearGradient', { id: 'ringGrad', x1: 0, y1: 0, x2: 1, y2: 1 }, e('stop', { offset: 0, stopColor: 'var(--accent-bright)' }), e('stop', { offset: 1, stopColor: 'var(--accent)' }))),
              e('circle', { cx: 170, cy: 170, r: R, fill: 'none', stroke: 'var(--line-soft)', strokeWidth: 2 }),
              e('circle', { cx: 170, cy: 170, r: R, fill: 'none', stroke: 'url(#ringGrad)', strokeWidth: 6, strokeLinecap: 'round', strokeDasharray: C, strokeDashoffset: C * (1 - progress), style: { filter: 'drop-shadow(0 0 12px var(--accent-glow))', transition: 'stroke-dashoffset 1s linear' } }),
            ),
            e('div', { className: 'timer-center' },

  function AppShell({ db, setDb, onLogout }) {
    const [route, setRoute] = useState('dashboard');
    const [subject, setSubject] = useState('Cálculo II');
    const [toast, setToast] = useState(null);
    const [moreOpen, setMoreOpen] = useState(false);

    function goTo(id) {
      setRoute(id);
      setMoreOpen(false);
    }

    function handleComplete(earnedXp) {
      setDb((prev) => ({ ...prev, character: { ...prev.character, xpTotal: prev.character.xpTotal + earnedXp } }));
      setToast({ xp: earnedXp });
      setTimeout(() => setToast(null), 5000);
      setRoute('dashboard');
    }

    function handleEquip(action) {
      if (action === 'revoke:all') {
        setDb((prev) => ({ ...prev, devices: prev.devices.filter((d) => d.current) }));
        return;
      }
      if (typeof action === 'string' && action.startsWith('revoke:')) {
        const id = action.slice('revoke:'.length);
        setDb((prev) => ({ ...prev, devices: prev.devices.filter((d) => d.id !== id) }));
        return;
      }
      setDb((prev) => ({
        ...prev,
        cosmetics: prev.cosmetics.map((c) => {
          const target = prev.cosmetics.find((x) => x.id === action);
          if (!target) return c;
          if (c.category !== target.category) return c;
          return { ...c, equipped: c.id === action };
        }),
      }));
    }

    const meta = { dashboard: ['Acampamento', 'Visão do dia', 'real'], sessao: ['Forja', 'Sessão Pomodoro', 'vision'], perfil: ['Personagem', 'Ficha do guerreiro', 'vision'], guilda: ['Guilda', db.guild.name, 'vision'] }[route];

          e('button', { type: 'button', className: 'brand', onClick: () => goTo('dashboard') },
            e('div', { className: 'brand-sigil' }, e(Decor.BrandSigil, { size: 32 })),
            e('div', null, e('div', { className: 'brand-name' }, 'WISE'), e('div', { className: 'brand-tag' }, 'Forje seu foco')),
          ),
          e('div', { className: 'nav-group-label' }, '◈ Jornada'),
          e(NavButtons, { variant: 'sidebar' }),
          e('div', { className: 'nav-group-label' }, '◈ Em breve'),
          NAV_FUTURE.map((item) => e('button', { key: item.id, type: 'button', className: 'nav-item disabled', disabled: true },
            e('span', { className: 'nav-icon' }, e(item.icon, { size: 16 })), item.label, e('span', { className: 'nav-badge' }, 'Em breve'))),
          e('div', { className: 'sidebar-foot' },
            e('div', { className: 'mini-char' },
              e('div', { className: 'avatar' }, db.user.displayName[0]),
              e('div', { className: 'mini-char-bars' },
                e('div', { className: 'mini-char-name' }, db.user.displayName),
                e('div', { className: 'mini-char-meta' }, 'Nível ' + progressionSnapshot(db.character.xpTotal).level + ' · 🜂 ' + db.currentStreakDays + 'd'),
              ),
            ),
            e('button', { type: 'button', className: 'btn-logout', onClick: onLogout }, e(I.logout, { size: 14 }), 'Sair'),
          ),
        ),

        e('main', { className: 'page' },
          e('header', { className: 'topbar' },
            e('div', { className: 'topbar-title' },
              e('h1', null, meta[0]),
              e('div', { className: 'breadcrumb-row' },
                e('span', { className: 'breadcrumb' }, '◈ ' + meta[1]),
                e(Fidelity, { kind: meta[2] }),
              ),
            ),
            e('div', { className: 'topbar-spacer' }),
          ),
          e('div', { className: 'page-body' },
            route === 'dashboard' && e(Dashboard, { db, onStartFocus: () => goTo('sessao'), onGoTo: goTo }),
            route === 'sessao' && e(Pomodoro, { subject, setSubject, totalMin: 25, onComplete: handleComplete }),
            route === 'perfil' && e(Profile, { db, onEquip: handleEquip }),
            route === 'guilda' && e(Guild, { db }),
          ),
        ),
      ),

      e('nav', { className: 'bottom-nav' },
        NAV.map((item) => e('button', { key: item.id, type: 'button', className: route === item.id ? 'active' : '', onClick: () => goTo(item.id) },
          e(item.icon, { size: 20 }), item.label)),
        e('button', { type: 'button', onClick: () => setMoreOpen(true) }, e(I.settings, { size: 20 }), 'Mais'),
      ),

      moreOpen && e('div', { className: 'more-menu-backdrop', onClick: () => setMoreOpen(false) },
        e('div', { className: 'more-menu', onClick: (ev) => ev.stopPropagation() },
          e('div', { className: 'more-menu-handle' }),
          NAV_FUTURE.map((item) => e('div', { key: item.id, className: 'nav-item disabled' },
            e('span', { className: 'nav-icon' }, e(item.icon, { size: 16 })), item.label, e('span', { className: 'nav-badge' }, 'Em breve'))),
          e('button', { type: 'button', className: 'btn-logout', style: { width: '100%', marginTop: 10 }, onClick: onLogout }, e(I.logout, { size: 14 }), 'Sair'),
        ),
      ),
    );
  }

  /* ====================== ROOT — máquina de estado de sessão ======================
     Espelha apps/frontend real: restoring → anonymous → authenticated.
     "unavailable" (API fora do ar) existe no app real; omitido aqui por
     não haver API de verdade pra falhar contra. */
  function Root() {
    const [status, setStatus] = useState('restoring');
    const [authScreen, setAuthScreen] = useState('login');
    const [db, setDb] = useState(buildMockDb);

    useEffect(() => {
      const t = setTimeout(() => setStatus('anonymous'), 550);
      return () => clearTimeout(t);
    }, []);

    if (status === 'restoring') {
      return e('div', { className: 'restoring-screen' }, e('div', { className: 'spinner-lg' }), e('p', { className: 'smallcaps' }, 'Restaurando sua jornada…'));
    }
    if (status === 'anonymous') {
      return authScreen === 'login'
        ? e(LoginScreen, { onLogin: () => setStatus('authenticated'), onGoRegister: () => setAuthScreen('register') })
        : e(RegisterScreen, { onRegister: () => setStatus('authenticated'), onGoLogin: () => setAuthScreen('login') });
    }
    return e(AppShell, { db, setDb, onLogout: () => setStatus('anonymous') });
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(e(Root));
})();
</script>
</body>
</html>
